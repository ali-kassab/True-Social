# Test configuration: in-memory H2 in MySQL mode, so tests need no external database.
spring.datasource.url=jdbc:h2:mem:truesocial;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-only-secret-key-with-at-least-32-bytes
app.jwt.expiration=1h

app.cloudinary.cloud-name=
app.cloudinary.api-key=
app.cloudinary.api-secret=

spring.data.web.pageable.max-page-size=50
