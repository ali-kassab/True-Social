spring.application.name=true-social
server.port=${PORT:8080}

# ===============================
# Datasource (MySQL)
# Credentials are read from environment variables - never commit real values.
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/RestApiDB?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===============================
# JWT
# JWT_SECRET is required and must be at least 32 characters long.
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:1h}

# ===============================
# Cloudinary (profile photos) - optional, uploads are disabled when not configured
# ===============================
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# Uploads & pagination
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.data.web.pageable.max-page-size=50
